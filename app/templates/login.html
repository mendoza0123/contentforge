{% extends "base.html" %}
{% block title %}Sign in — ContentForge{% endblock %}
{% block content %}
<div class="login-wrap">
    <div class="login-card">
        <div class="login-logo">
            <div class="spark">⚡</div>
            <h1>Content<em>Forge</em></h1>
            <p>SEO · AEO · GEO content engine</p>
        </div>

        {% if error %}
        <div class="alert alert-bad mb-2">
            <span class="ai">⚠</span>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" action="/login" autocomplete="on">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required
                       inputmode="email" autocomplete="username"
                       autocapitalize="none" autocorrect="off" spellcheck="false"
                       placeholder="admin@ais-tech.com">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required
                       autocomplete="current-password" placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Sign in</button>
        </form>

        <div class="login-foot">
            Demo access<br>
            <code>admin@ais-tech.com</code> · <code>admin123</code>
        </div>
    </div>
</div>
{% endblock %}
